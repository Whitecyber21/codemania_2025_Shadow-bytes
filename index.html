<!DOCTYPE html>
<html>
<head>
  <title>Phishing Detection & Awareness</title>
</head>
<body>
  <h1>Phishing URL Checker</h1>
  <input type="text" id="urlInput" placeholder="Enter URL">
  <button onclick="checkURL()">Check</button>
  <div id="result"></div>
  <div id="awareness" style="display:none;">
    <h2>Phishing Awareness</h2>
    <ul>
      <li>Never click suspicious links.</li>
      <li>Check for HTTPS and valid domain names.</li>
      <li>Be wary of urgent or threatening language.</li>
    </ul>
  </div>
  <script>
    async function checkURL() {
      const url = document.getElementById('urlInput').value;
      const response = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
      });
      const data = await response.json();
      const resultDiv = document.getElementById('result');
      const awarenessDiv = document.getElementById('awareness');
      if (data.phishing) {
        resultDiv.innerHTML = "<span style='color:red;'>Warning: This URL is likely a phishing site!</span>";
        awarenessDiv.style.display = 'block';
      } else {
        resultDiv.innerHTML = "<span style='color:green;'>This URL appears safe.</span>";
        awarenessDiv.style.display = 'none';
      }
    }
  </script>
</body>
</html>
